name: Public RSS check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch and inspect public feeds
        shell: bash
        run: |
          mkdir -p report
          python3 - <<'PY'
          import json, os, urllib.request, xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          feeds = {name: 'https://www.economist.com/' + name + '/rss.xml' for name in ['latest', 'finance-and-economics', 'business', 'china']}
          feeds['ft-international'] = 'https://www.ft.com/rss/home/international'
          results = []
          for name, url in feeds.items():
              result = {'source': name, 'url': url, 'checked_utc': datetime.now(timezone.utc).isoformat()}
              try:
                  request = urllib.request.Request(url, headers={'User-Agent': 'RSSDiagnostics/1.0', 'Accept': 'application/rss+xml, application/xml, text/xml'})
                  with urllib.request.urlopen(request, timeout=25) as response:
                      result['http_status'] = response.status
                      raw = response.read(5000001)
                  if len(raw) > 5000000:
                      raise ValueError('Response exceeds 5 MB limit')
                  root = ET.fromstring(raw)
                  items = root.findall('./channel/item')
                  if root.tag != 'rss':
                      raise ValueError('Expected RSS document, received ' + root.tag)
                  entries = []
                  for item in items:
                      entries.append({'title': item.findtext('title'), 'link': item.findtext('link'), 'pubDate': item.findtext('pubDate'), 'description_characters': len(item.findtext('description') or ''), 'has_content_encoded': item.find('{http://purl.org/rss/1.0/modules/content/}encoded') is not None})
                  result['entry_count'] = len(entries)
                  result['entries'] = entries
              except Exception as error:
                  result['error'] = str(error)
              results.append(result)
          with open('report/results.json', 'w', encoding='utf-8') as handle:
              json.dump(results, handle, ensure_ascii=False, indent=2)
          lines = ['# Public RSS diagnostics', '', '| Source | Items | Result |', '| --- | ---: | --- |']
          for result in results:
              lines.append('| ' + result['source'] + ' | ' + str(result.get('entry_count', '-')) + ' | ' + result.get('error', 'RSS parsed').replace('|', '/') + ' |')
          summary = chr(10).join(lines)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as handle:
              handle.write(summary)
          print(json.dumps(results, ensure_ascii=False, indent=2))
          PY
      - name: Save diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: rss-diagnostics
          path: report/
          retention-days: 1
